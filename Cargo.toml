[package]
name = "storage_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "storage_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
redis = "0.25"
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = []
